# Pubblica Sottocosto su Firebase.
#   • Automatico: ogni push su `main` o sul ramo di lavoro pubblica tutto (sito, regole, funzioni).
#   • Manuale:    GitHub → Actions → "Pubblica su Firebase" → Run workflow (si può scegliere cosa pubblicare).
# Richiede due segreti nel repository (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  contenuto JSON della chiave di un account di servizio con i permessi per il deploy
#   WEB_ENV                   contenuto del file web/.env (config Firebase del sito)
# Se i segreti mancano l'esecuzione fallisce (croce rossa) con le istruzioni: una spunta verde significa sempre «pubblicato».
name: Pubblica su Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cosa pubblicare"
        type: choice
        default: all
        options: [all, hosting, functions]
  push:
    branches: [main, ccr-06ea5088-ecx2rv]
    paths-ignore: ["README.md", "docs/**", "**/*.md"]

concurrency: deploy-firebase

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target || 'all' }}
      PROJECT: studio-7805098640-5b1fc
    steps:
      - name: Controllo segreti
        id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB: ${{ secrets.WEB_ENV }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SA" ] || [ -z "$WEB" ]; then
            MSG="NON PUBBLICATO: mancano i segreti FIREBASE_SERVICE_ACCOUNT e/o WEB_ENV. Aggiungili in Settings → Secrets and variables → Actions (istruzioni in cima a .github/workflows/deploy.yml)."
            echo "::error::$MSG"
            echo "### ❌ $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Test (funzioni)
        if: steps.cfg.outputs.ok == 'true' && env.TARGET != 'hosting'
        run: |
          pip install -q -r functions/requirements.txt pytest
          python -m pytest -q functions

      - name: Compila il sito
        if: steps.cfg.outputs.ok == 'true' && env.TARGET != 'functions'
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}
        run: |
          printf '%s\n' "$WEB_ENV" > web/.env
          npm ci --prefix web
          npm run build --prefix web

      - name: Ambiente Python per le funzioni
        if: steps.cfg.outputs.ok == 'true' && env.TARGET != 'hosting'
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install -q -r functions/requirements.txt

      - name: Pubblica
        if: steps.cfg.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          export PATH="$PWD/functions/venv/bin:$PATH"
          case "$TARGET" in
            all)       npx -y firebase-tools@latest deploy --project "$PROJECT" --non-interactive ;;
            hosting)   npx -y firebase-tools@latest deploy --project "$PROJECT" --non-interactive --only hosting,firestore,storage ;;
            functions) npx -y firebase-tools@latest deploy --project "$PROJECT" --non-interactive --only functions ;;
          esac
          rm -f "$RUNNER_TEMP/sa.json"
